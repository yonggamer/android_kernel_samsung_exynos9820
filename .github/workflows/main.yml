name: Build Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            lz4 \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            clang-15 \
            lld-15

      - name: Set Clang as default compiler
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 100
          export CC=clang
          export CXX=clang++

      - name: Build the kernel
        run: |
          # Set environment variables for a Clang build
          export TARGET_KERNEL_CLANG_COMPILE=true
          export TARGET_KERNEL_CLANG_VERSION=clang-15
          # Generate default configuration using the desired defconfig
          make ARCH=arm64 exynos9820-beyond0lte_defconfig
          # Disable CONFIG_CC_STACKPROTECTOR_STRONG since -fstack-protector-strong is unsupported
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          # Update configuration to apply changes
          make ARCH=arm64 olddefconfig
          # Build the kernel
          make ARCH=arm64 -j$(nproc)
          mkdir -p output
          cp arch/arm64/boot/Image output/

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: kernel
          path: output/
