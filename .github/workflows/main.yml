name: Build Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev

    - name: Build the kernel
      run: |
        export TARGET_KERNEL_SOURCE=path/to/kernel/source
        export TARGET_KERNEL_ARCH=arm64
        export TARGET_KERNEL_CROSS_COMPILE_PREFIX=aarch64-linux-android-
        export TARGET_KERNEL_CLANG_COMPILE=true
        export TARGET_KERNEL_CLANG_VERSION=clang-r450784d
        export TARGET_KERNEL_LLVM_BINUTILS=true
        export TARGET_KERNEL_RUST_VERSION=1.73.0c
        
        make ARCH=arm64 exynos9820-beyond0lte_defconfig
        make ARCH=arm64 -j$(nproc)
        mkdir -p output
        cp arch/arm64/boot/Image output/

    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4.4.3
      with:
        name: kernel
        path: output/
