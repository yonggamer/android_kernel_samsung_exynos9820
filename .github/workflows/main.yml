name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Download and set up Android platform tools
        run: |
          curl -O https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip platform-tools-latest-linux.zip -d ~
          if [ -d "$HOME/platform-tools" ] ; then PATH="$HOME/platform-tools:$PATH" fi
          source ~/.profile

      - name: Set up dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev lib32ncurses5-dev libncurses5 libncurses5-dev

      - name: Compile Kernel
        run: make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- all

      - name: Archive Build Output
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-build
          path: path/to/kernel/output/
