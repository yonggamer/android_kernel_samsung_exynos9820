name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up dependencies
        run: |
          sudo apt-get update
          # Install latest available versions of dependencies from the standard repositories.
          sudo apt-get install -y \
            gcc \
            clang \
            make \
            binutils \
            util-linux \
            kmod \
            e2fsprogs \
            jfsutils \
            reiserfsprogs \
            xfsprogs \
            squashfs-tools \
            btrfs-progs \
            pcmciautils \
            quota-tools \
            ppp \
            isdn4k-utils \
            nfs-common \
            procps \
            oprofile \
            udev \
            grub \
            mcelog \
            iptables \
            openssl \
            bc

      - name: Compile Kernel
        run: |
          # Adjust ARCH and CROSS_COMPILE as required for your kernel build.
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- all

      - name: Archive Build Output
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-build
          path: path/to/kernel/output/
