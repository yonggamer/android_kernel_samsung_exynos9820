name: Build Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            lz4 \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            gcc-10 \
            g++-10 \
            binutils

      - name: Set GCC version
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 10
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 10

      - name: Build the kernel
        run: |
          # Generate default configuration
          make ARCH=arm64 exynos9820-beyond0lte_defconfig
          # Disable the stack protector setting that is not supported
          scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          # Update the configuration based on the change above
          make ARCH=arm64 olddefconfig
          # Build the kernel
          make ARCH=arm64 -j$(nproc)
          mkdir -p output
          cp arch/arm64/boot/Image output/

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: kernel
          path: output/
